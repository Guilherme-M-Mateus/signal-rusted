[package]
name = "signal-rs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native Rust Signal desktop client (iced UI, presage/libsignal protocol)"

[dependencies]
presage = { path = "vendor/presage" }
presage-store-sqlite = { path = "vendor/presage-store-sqlite" }
iced = { version = "0.14", features = ["tokio", "image", "qr_code", "advanced"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs"] }
futures = "0.3"
emojis = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = "0.4"
mime_guess = "2"
rand = "0.9"
hex = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
notify-rust = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Same libsignal tag libsignal-service uses: decrypts and parses link-time history transfers.
# `test-util` only makes the generated `proto` module public (no extra deps).
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
protobuf = "3.7.2"
# Decodes RingRTC's group-ring payload (already used by libsignal-service).
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
url = "2"
# Opens clicked links in the system browser (xdg-open / open / ShellExecute, no shell quoting issues).
open = "5"
# Voice notes: playback (symphonia decoders: mp3, aac/m4a, ogg vorbis) and mic capture via cpal.
rodio = { version = "0.23", default-features = false, features = ["playback", "recording", "mp3", "mp4", "vorbis"] }
# Builds its bundled LAME (LGPL) with cc; no system library needed.
mp3lame-encoder = "0.2"
# SQLCipher key in the OS keyring: Secret Service (libdbus) on Linux, Keychain, Credential Manager.
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }

# 1:1 voice/video calls (feature `calls`, see docs/calls.md). Its build script downloads
# Signal's prebuilt WebRTC (libwebrtc.a) through RingRTC's own bin/fetch-artifact.
ringrtc = { git = "https://github.com/signalapp/ringrtc", tag = "v2.73.0", features = ["native"], optional = true }

[features]
calls = ["dep:ringrtc"]

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"

# Mirrors presage's workspace: patches don't propagate from git dependencies.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

# For `--features calls`: cubeb (via RingRTC) bundles its own Rust std, which clashes with
# ours once LTO merges std into the binary. `cargo build --profile release-calls --features calls`
[profile.release-calls]
inherits = "release"
lto = false
